# Tool settings only: the project runs from the repo root and is not installed as a package.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Browser tests start a server and Chromium: run them with  pytest tests/e2e -m e2e
addopts = ["-m", "not e2e"]
markers = ["e2e: the website in a real browser (tests/e2e, requirements-e2e.txt)"]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Korean strings, regexes and data tables read better on one line.
"tests/*" = ["E501"]
"preprocess/*" = ["E501"]
"rag/bins.py" = ["E501"]
"rag/schedule_text.py" = ["E501"]
"rag/texts.py" = ["E501"]
"eval/make_cases.py" = ["E501"]
# PDF layout code: its zips pair neighbouring edges and table cells of unequal length.
"preprocess/parse_item_guides.py" = ["E501", "B905", "B023"]

[tool.ruff.lint.isort]
known-first-party = ["app", "eval", "experiments", "ingest", "preprocess", "rag", "tests"]
