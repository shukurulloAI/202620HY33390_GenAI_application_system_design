# Lint and tests on every push and pull request. No models, no index, no Ollama: the tests
# use scripted LLMs, real chunks and the real schedule table (tests/helpers.py).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"          # a test that needs a model download fails instead of hanging
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-app.txt

      - name: Install (CPU-only torch keeps the install small)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-app.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Frozen dev/test split unchanged
        run: python -m eval.make_cases --check

      - name: Tests
        run: python -m pytest -q --cov=rag --cov=eval --cov-report=term

  # The page in a real browser (Chromium) against the offline demo: axe-core finds no
  # accessibility violations (light and dark, phone and desktop, all six languages); the
  # area pickers, the language link, the question flow and the keyboard path work.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-e2e.txt

      - name: Install (the offline demo needs no torch and no models)
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements.lock streamlit pydantic tzdata pytest -r requirements-e2e.txt
          python -m playwright install --with-deps chromium

      - name: Browser tests
        run: E2E_SCREENSHOTS=e2e-screenshots python -m pytest tests/e2e -m e2e -q

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-screenshots
          path: e2e-screenshots
          if-no-files-found: ignore

  # The deployable website: the offline image must start, report healthy and serve the
  # page; the full image must build. compose.yaml must parse.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: compose.yaml is valid
        run: docker compose --profile offline --profile live config --quiet

      - name: Build the offline image
        run: docker build --target offline -t waste-assistant:offline .

      - name: It starts, is healthy and serves the page
        run: |
          docker run -d --name demo -p 8501:8501 waste-assistant:offline
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8501/_stcore/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8501/ | grep -q "<title>"
          for i in $(seq 1 30); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' demo)" = healthy ] && break
            sleep 3
          done
          docker inspect --format '{{.State.Health.Status}}' demo | grep -qx healthy
          docker exec demo id -u | grep -qx 1000            # not root

      - name: Logs
        if: always()
        run: docker logs demo || true

      - name: The full image builds
        run: docker build -t waste-assistant .
